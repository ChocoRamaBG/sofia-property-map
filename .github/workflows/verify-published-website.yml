name: Verify the published SofiaPermits website

on:
  workflow_dispatch:
    inputs:
      require_parcel_catalogue:
        description: 'Require the complete current official parcel catalogue to be active'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out read-only verification
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Read and verify deployed public files
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          REQUIRE_PARCEL_CATALOGUE: ${{ inputs.require_parcel_catalogue }}
        run: |
          if [ "$REQUIRE_PARCEL_CATALOGUE" = "true" ]; then
            python scripts/verify_published_site.py --require-parcel-catalogue --output seed/verification/published-site.json
          else
            python scripts/verify_published_site.py --output seed/verification/published-site.json
          fi
      - name: Keep verification evidence
        uses: actions/upload-artifact@v4
        with:
          name: sofia-published-site-verification-${{ github.run_id }}
          path: seed/verification/published-site.json
          retention-days: 31
          if-no-files-found: error
