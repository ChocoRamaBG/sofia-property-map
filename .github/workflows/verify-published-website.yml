name: Verify the published SofiaPermits website

on:
  workflow_dispatch:
    inputs:
      require_parcel_catalogue:
        description: 'Require the complete current official parcel catalogue to be active'
        required: false
        default: false
        type: boolean
      require_fresh_market:
        description: 'Require the active price dataset to be a daily capture within 48 hours'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out read-only verification
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Read and verify deployed public files
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          REQUIRE_PARCEL_CATALOGUE: ${{ inputs.require_parcel_catalogue }}
          REQUIRE_FRESH_MARKET: ${{ inputs.require_fresh_market }}
        run: |
          verify_args=(--output seed/verification/published-site.json)
          if [ "$REQUIRE_PARCEL_CATALOGUE" = "true" ]; then
            verify_args+=(--require-parcel-catalogue)
          fi
          if [ "$REQUIRE_FRESH_MARKET" = "true" ]; then
            verify_args+=(--require-fresh-market)
          fi
          python scripts/verify_published_site.py "${verify_args[@]}"
      - name: Keep verification evidence
        uses: actions/upload-artifact@v4
        with:
          name: sofia-published-site-verification-${{ github.run_id }}
          path: seed/verification/published-site.json
          retention-days: 31
          if-no-files-found: error
