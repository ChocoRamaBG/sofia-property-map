name: Daily Sofia asking-price refresh

on:
  schedule:
    # 06:23 Sofia in summer; 05:23 in winter. GitHub may delay scheduled jobs.
    - cron: '23 3 * * *'
  workflow_dispatch:
    inputs:
      reuse_capture_run_id:
        description: 'Advanced recovery only: completed daily run ID with a complete capture less than 6 hours old; leave blank for a fresh full refresh'
        required: false
        default: ''
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: daily-sofia-asking-price-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      PYTHONUNBUFFERED: '1'
    steps:
      - name: Check out the website and consolidated parser
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements-imot.txt
      - name: Install market parser dependencies
        run: python -m pip install -r scripts/requirements-imot.txt
      - name: Check enrichment and comparison invariants
        run: python -m unittest discover -s scripts -p 'test_imot*.py'
      - name: Fetch verified previous private market state
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: python scripts/deploy_imot_ftps.py fetch --output seed/daily/previous-pointer.json --state-output seed/daily/previous-state.json
      - name: Capture all apartment search leaves
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.reuse_capture_run_id == '' }}
        run: python scripts/imot_scraper.py --output seed/daily/capture.json --resume
      - name: Recover a recent complete source capture without another crawl
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.reuse_capture_run_id != '' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RECOVERY_RUN_ID: ${{ inputs.reuse_capture_run_id }}
        run: python scripts/recover_imot_capture.py --run "$RECOVERY_RUN_ID" --output seed/daily/capture.json
      - name: Analyze seller and property text with a bounded incremental detail pass
        run: python scripts/imot_enrichment.py --input seed/daily/capture.json --previous-state seed/daily/previous-state.json --output seed/daily/capture-enriched.json --limit 1200 --maximum-seconds 2700
      - name: Preserve private source evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v6
        with:
          name: imot-source-evidence-${{ github.run_id }}
          path: |
            seed/daily/capture.json
            seed/daily/capture-enriched.json
            seed/daily/capture-progress.json
          if-no-files-found: ignore
          retention-days: 31
      - name: Build peer comparisons and daily changes
        run: python scripts/imot_market.py --input seed/daily/capture-enriched.json --previous-state seed/daily/previous-state.json --output seed/daily/publish
      - name: Validate every prepared file and stable listing ID
        run: python scripts/deploy_imot_ftps.py validate --input seed/daily/publish
      - name: Preserve complete private prepared snapshot
        if: ${{ always() }}
        uses: actions/upload-artifact@v6
        with:
          name: imot-prepared-snapshot-${{ github.run_id }}
          path: seed/daily/publish/
          if-no-files-found: ignore
          retention-days: 31
      - name: Publish verified snapshot and retain recent market history
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: python scripts/deploy_imot_ftps.py publish --input seed/daily/publish --previous seed/daily/previous-pointer.json
      - name: Summarize the completed refresh
        env:
          RECOVERY_RUN_ID: ${{ inputs.reuse_capture_run_id }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          pointer = json.loads(Path('seed/daily/publish/market-active.json').read_text())
          folder = Path('seed/daily/publish/market-snapshots') / pointer['snapshot_id']
          summary = json.loads((folder / 'summary.json').read_text())
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as output:
              output.write('# Completed Sofia asking-price refresh\n\n')
              output.write(f"Capture: {summary['captured_at']}\n\n")
              output.write(f"Listings: {summary['counts']['listing_count']:,}\n\n")
              output.write(f"New daily candidates: {summary['daily_candidates_total']:,}\n\n")
              output.write(f"Approximate street/quarter locations: {summary['counts'].get('located_count', 0):,}\n\n")
              output.write(f"Full descriptions analyzed (current valid cache): {summary['counts'].get('description_analyzed_count', 0):,}; incremental budget up to 1,200 per run within 45 minutes.\n\n")
              output.write(f"Professional agency identities: {summary['counts'].get('agency_identity_count', 0):,}; published agency phones: {summary['counts'].get('agency_phone_count', 0):,}.\n\n")
              output.write(f"Seller labels: {summary['counts'].get('seller_types', {})}\n\n")
              if os.environ.get('RECOVERY_RUN_ID'):
                  output.write(f"Source capture recovered from completed daily run {os.environ['RECOVERY_RUN_ID']}; the original source timestamps are preserved.\n\n")
              output.write('Asking-price estimates, not transaction valuations. First complete live capture or a changed comparison method establishes an alert baseline. Approximate locations are reference areas, not verified property positions.\n')
          PY
