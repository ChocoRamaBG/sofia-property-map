name: Monthly Sofia register refresh

on:
  schedule:
    # GitHub schedules use UTC. A complete overlapping window is fetched.
    - cron: '17 4 1 * *'
  workflow_dispatch:
    inputs:
      start_date:
        description: 'Optional earlier start date (DD.MM.YYYY); blank selects a window without gaps'
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: monthly-sofia-register-refresh
  cancel-in-progress: false

jobs:
  official-market-context:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out official statistics parser
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install official-table reader
        run: python -m pip install openpyxl==3.1.5
      - name: Fetch previously published official history
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: python scripts/deploy_site_ftps.py --fetch-context --input public
      - name: Refresh official prices and residential construction volumes
        run: python scripts/refresh_housing_context.py --output public/data/housing-context.json
      - name: Publish verified official housing context
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: python scripts/deploy_site_ftps.py --context-only --input public
      - name: Keep the completed official context
        uses: actions/upload-artifact@v4
        with:
          name: sofia-official-market-context-${{ github.run_id }}
          path: public/data/housing-context.json
          retention-days: 31
          if-no-files-found: error

  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    concurrency:
      group: sofia-parcel-boundaries
      cancel-in-progress: false
    env:
      NAG_HEADLESS: '1'
    steps:
      - name: Check out parser source
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements-monthly.txt
      - name: Install parser dependencies
        run: python -m pip install -r scripts/requirements-monthly.txt
      - name: Fetch previous private dataset
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: python scripts/deploy_registry_ftps.py fetch --output seed/monthly/previous.json
      - name: Fetch previous private cadastral pointer
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: python scripts/deploy_cadastre_ftps.py fetch --output seed/monthly/previous-cadastre.json
      - name: Select an overlapping date window
        env:
          MANUAL_START_DATE: ${{ inputs.start_date }}
        run: |
          if [ -n "$MANUAL_START_DATE" ]; then
            start_date="$MANUAL_START_DATE"
          else
            start_date=$(python scripts/build_registry_snapshot.py --previous seed/monthly/previous.json --choose-start-date)
          fi
          printf 'NAG_START_DATE=%s\n' "$start_date" >> "$GITHUB_ENV"
      - name: Capture all three official registers
        run: python scripts/scrape_registers.py --source all --output seed/monthly/capture
      - name: Keep failed public-register diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: sofia-register-failure-diagnostics-${{ github.run_id }}
          path: seed/monthly/diagnostics/
          retention-days: 31
          if-no-files-found: ignore
      - name: Keep every completed source capture
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sofia-completed-register-captures-${{ github.run_id }}
          path: seed/monthly/capture/*.json
          retention-days: 31
          if-no-files-found: ignore
      - name: Validate and merge earlier observations
        run: python scripts/build_registry_snapshot.py --previous seed/monthly/previous.json --capture seed/monthly/capture --format sharded --output seed/monthly/publish
      - name: Capture all 24 published Sofia cadastral parcel exports
        run: python scripts/refresh_cadastre.py --archives seed/monthly/cadastre-archives --output seed/monthly/cadastre-publish
      - name: Validate complete cadastral snapshot against earlier coverage
        run: python scripts/deploy_cadastre_ftps.py validate --input seed/monthly/cadastre-publish --previous seed/monthly/previous-cadastre.json
      - name: Keep the completed merged snapshot
        uses: actions/upload-artifact@v4
        with:
          name: sofia-register-snapshot-${{ github.run_id }}
          path: seed/monthly/publish/
          retention-days: 31
          if-no-files-found: error
      - name: Keep the completed cadastral snapshot
        uses: actions/upload-artifact@v4
        with:
          name: sofia-cadastre-snapshot-${{ github.run_id }}
          path: seed/monthly/cadastre-publish/
          retention-days: 31
          if-no-files-found: error
      - name: Publish verified private cadastral dataset
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: python scripts/deploy_cadastre_ftps.py publish --input seed/monthly/cadastre-publish --previous seed/monthly/previous-cadastre.json
      - name: Publish verified private dataset
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: python scripts/deploy_registry_ftps.py publish --input seed/monthly/publish --previous seed/monthly/previous.json
      - name: Fetch the previous protected parcel boundary pointer
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: python scripts/deploy_boundary_ftps.py fetch --output seed/monthly/previous-boundaries.json
      - name: Prepare full parcel boundaries from the same official archives
        env:
          PROJ_NETWORK: 'OFF'
        run: python scripts/build_boundary_snapshot.py --catalogue scripts/cadastre-sofia-sources.json --archives seed/monthly/cadastre-archives --output seed/monthly/boundary-publish
      - name: Validate complete parcel boundary snapshot
        run: python scripts/deploy_boundary_ftps.py validate --input seed/monthly/boundary-publish --previous seed/monthly/previous-boundaries.json
      - name: Publish verified private parcel boundaries
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: python scripts/deploy_boundary_ftps.py publish --input seed/monthly/boundary-publish --previous seed/monthly/previous-boundaries.json
      - name: Keep the boundary source and geometry hash manifest
        uses: actions/upload-artifact@v4
        with:
          name: sofia-boundary-manifest-${{ github.run_id }}
          path: seed/monthly/boundary-publish/manifest.json
          retention-days: 31
          if-no-files-found: error
