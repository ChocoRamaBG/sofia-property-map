name: Monthly Sofia register refresh

on:
  schedule:
    # GitHub schedules use UTC. A complete overlapping window is fetched.
    - cron: '17 4 1 * *'
  workflow_dispatch:
    inputs:
      start_date:
        description: 'Optional earlier start date (DD.MM.YYYY); blank selects a window without gaps'
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: monthly-sofia-register-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      NAG_HEADLESS: '1'
    steps:
      - name: Check out parser source
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements-monthly.txt
      - name: Install parser dependencies
        run: python -m pip install -r scripts/requirements-monthly.txt
      - name: Fetch previous private dataset
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: python scripts/deploy_registry_ftps.py fetch --output seed/monthly/previous.json
      - name: Select an overlapping date window
        env:
          MANUAL_START_DATE: ${{ inputs.start_date }}
        run: |
          if [ -n "$MANUAL_START_DATE" ]; then
            start_date="$MANUAL_START_DATE"
          else
            start_date=$(python scripts/build_registry_snapshot.py --previous seed/monthly/previous.json --choose-start-date)
          fi
          printf 'NAG_START_DATE=%s\n' "$start_date" >> "$GITHUB_ENV"
      - name: Capture all three official registers
        run: python scripts/scrape_registers.py --source all --output seed/monthly/capture
      - name: Keep every completed source capture
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sofia-completed-register-captures-${{ github.run_id }}
          path: seed/monthly/capture/*.json
          retention-days: 31
          if-no-files-found: ignore
      - name: Validate and merge earlier observations
        run: python scripts/build_registry_snapshot.py --previous seed/monthly/previous.json --capture seed/monthly/capture --output seed/monthly/registry-data.json
      - name: Keep the completed merged snapshot
        uses: actions/upload-artifact@v4
        with:
          name: sofia-register-snapshot-${{ github.run_id }}
          path: seed/monthly/registry-data.json
          retention-days: 31
          if-no-files-found: error
      - name: Publish verified private dataset
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: python scripts/deploy_registry_ftps.py publish --input seed/monthly/registry-data.json --previous seed/monthly/previous.json
